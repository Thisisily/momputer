[workspace]
resolver = "3"
members = ["crates/mom-core", "crates/mom-cli", "app/src-tauri"]
default-members = ["crates/mom-core", "crates/mom-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["momputer contributors"]
repository = "https://github.com/momputer/momputer"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
regex = "1"
dirs = "7"
walkdir = "2"
trash = "5"
junction = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_Console",
    "Win32_System_WindowsProgramming",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_UI_Shell",
    "Wdk_System_SystemInformation",
] }
mom-core = { path = "crates/mom-core" }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
