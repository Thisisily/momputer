[workspace]
resolver = "3"
members = ["crates/mom-core", "crates/mom-cli", "app/src-tauri"]
default-members = ["crates/mom-core", "crates/mom-cli"]

[workspace.package]
version = "0.4.0"
edition = "2021"
license = "PolyForm-Noncommercial-1.0.0"
authors = ["momputer contributors"]
repository = "https://github.com/Thisisily/momputer"
rust-version = "1.90"

[workspace.dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
toml = "1"
sysinfo = { version = "0.38", default-features = false, features = ["system"] }
regex = "1"
dirs = "7"
walkdir = "2"
trash = "5"
junction = "1"
blake3 = "1"
rusqlite = { version = "0.40", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_NetworkManagement_IpHelper",
    "Win32_Networking_WinSock",
    "Win32_System_Threading",
    "Win32_System_JobObjects",
    "Win32_System_Console",
    "Win32_System_WindowsProgramming",
    "Win32_System_SystemInformation",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Cryptography_Catalog",
    "Win32_Security_Cryptography_Sip",
    "Win32_Security_WinTrust",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Performance",
    "Win32_System_IO",
    "Win32_Storage_Packaging_Appx",
    "Wdk_System_SystemInformation",
] }
mom-core = { path = "crates/mom-core" }

# Debug builds are for tests and checks. A line number in a backtrace is enough to find a
# failure; full debug info for every dependency made target\ grow to 33 GB in a day of work.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

# No link-time optimisation across crates: it made the last step of every build (linking
# momputer.exe) take four minutes of the six a rebuild took, for a slightly smaller file.
[profile.release]
opt-level = 3
lto = false
codegen-units = 16
strip = true
