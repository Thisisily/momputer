<!doctype html>
<!-- The README's top picture (1600 x 700), dark and (with ?light) light, and the link preview
     (1280 x 640). Rendered to PNG by scripts/images.py. Mom is drawn by the app's own mom.js. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>momputer</title>
<link rel="stylesheet" href="/app/ui/styles.css">
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #050505; color: #fff; }
  body {
    --ink-soft: #a8a8a8;
    --ink-mid: #c9c9c9;
    --ring: #151515;
    --chip: rgba(255, 255, 255, 0.07);
    --chip-edge: rgba(255, 255, 255, 0.14);
    display: grid;
    grid-template-columns: 43% 1fr;
    align-items: center;
    background:
      radial-gradient(ellipse at 22% 50%, rgba(255, 255, 255, 0.10), transparent 58%),
      radial-gradient(ellipse at 96% 4%, rgba(255, 59, 71, 0.10), transparent 42%),
      radial-gradient(ellipse at 88% 100%, rgba(47, 224, 122, 0.08), transparent 46%),
      radial-gradient(circle at 1px 1px, rgba(255, 255, 255, 0.075) 1px, transparent 1.6px) 0 0 / 24px 24px,
      #050505;
    font-family: "Geist", "Segoe UI", sans-serif;
  }
  /* For a white page: the same picture, the other way round. */
  .light body {
    --ink-soft: #5c5c5c;
    --ink-mid: #2b2b2b;
    --ring: #e2e2e2;
    --chip: rgba(0, 0, 0, 0.05);
    --chip-edge: rgba(0, 0, 0, 0.14);
    color: #000;
    background:
      radial-gradient(ellipse at 22% 50%, #ffffff, transparent 58%),
      radial-gradient(ellipse at 96% 4%, rgba(215, 25, 33, 0.08), transparent 42%),
      radial-gradient(ellipse at 88% 100%, rgba(15, 165, 72, 0.08), transparent 46%),
      radial-gradient(circle at 1px 1px, rgba(0, 0, 0, 0.11) 1px, transparent 1.6px) 0 0 / 24px 24px,
      #f1f1f1;
  }
  .face {
    justify-self: center;
    width: 62vh;
    height: 62vh;
    border-radius: 50%;
    background: #fff;
    box-shadow: 0 0 0 1.6vh var(--ring), 0 6vh 14vh -4vh rgba(0, 0, 0, 0.55);
    display: grid;
    place-items: center;
    overflow: hidden;
  }
  .face svg { width: 94%; height: auto; margin-top: 4%; }
  .words { padding-right: 8%; }
  .wordmark { font-family: "Doto", monospace; font-variation-settings: "ROND" 100; font-weight: 900; font-size: 17.5vh; line-height: 1; letter-spacing: 0.02em; margin-left: -0.04em; }
  h1 { margin: 4.6vh 0 0; font-size: 6.9vh; line-height: 1.12; font-weight: 750; letter-spacing: -0.025em; }
  p { margin: 2.8vh 0 0; font-size: 3.35vh; line-height: 1.5; color: var(--ink-soft); max-width: 31em; }
  .lights { display: flex; gap: 4.4vh; margin-top: 4.4vh; font-size: 2.9vh; font-weight: 550; color: var(--ink-mid); }
  .lights span { display: inline-flex; align-items: center; gap: 1.7vh; }
  .lights i { width: 1.45vh; height: 1.45vh; border-radius: 50%; background: #2fe07a; box-shadow: 0 0 1.6vh rgba(47, 224, 122, 0.7); }
  .lights i.red { background: #ff3b47; box-shadow: 0 0 1.6vh rgba(255, 59, 71, 0.7); }
  .light .lights i { background: #0fa548; box-shadow: none; }
  .light .lights i.red { background: #d71921; }
  .systems { display: flex; gap: 1.6vh; margin-top: 4.4vh; }
  .systems span { padding: 1.1vh 2.4vh; border-radius: 99px; background: var(--chip); box-shadow: inset 0 0 0 1px var(--chip-edge); font-family: "Doto", monospace; font-variation-settings: "ROND" 100; font-weight: 900; font-size: 2.5vh; letter-spacing: 0.14em; text-transform: uppercase; }
</style>
</head>
<body>
  <div class="face" id="face"></div>
  <div class="words">
    <div class="wordmark">momputer</div>
    <h1>A mom for you, your computer and your AIs.</h1>
    <p>She turns off what AI agents left running, frees up disk space, and keeps an eye on the computer itself. She always shows you first.</p>
    <div class="lights"><span><i></i>watching</span><span><i class="red"></i>3 left running</span><span><i></i>20.1 GB to free up</span></div>
    <div class="systems"><span>Windows</span><span>Mac</span></div>
  </div>
  <script src="/app/ui/mom.js"></script>
  <script>
    document.documentElement.classList.toggle("light", location.search.includes("light"));
    document.getElementById("face").innerHTML = window.momFace.svg("look");
  </script>
</body>
</html>
