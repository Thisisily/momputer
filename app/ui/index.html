<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>momputer</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app">
    <header class="titlebar">
      <div class="brand">
        <span class="led" id="live"></span>
        <span class="wordmark dot" id="wordmark">momputer</span>
        <span class="big-badge dot" id="big-badge" hidden>BIG MODE</span>
        <span class="checked num" id="checked"></span>
      </div>
      <div class="win-buttons">
        <button class="icon-btn" id="btn-big" title="BIG MODE: a full window, with your PC on mom's desk" aria-label="BIG MODE" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M9 21H3v-6"/><path d="m21 3-7 7"/><path d="m3 21 7-7"/></svg>
        </button>
        <button class="icon-btn" id="btn-refresh" title="Look again" aria-label="Look again">
          <svg viewBox="0 0 24 24"><path d="M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/><path d="M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16"/><path d="M8 16H3v5"/></svg>
        </button>
        <button class="icon-btn" id="btn-pin" title="Keep on top of other windows" aria-label="Keep on top" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M12 17v5"/><path d="M9 10.76a2 2 0 0 1-1.11 1.79l-1.78.9A2 2 0 0 0 5 15.24V16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-.76a2 2 0 0 0-1.11-1.79l-1.78-.9A2 2 0 0 1 15 10.76V7a1 1 0 0 1 1-1 2 2 0 0 0 0-4H8a2 2 0 0 0 0 4 1 1 0 0 1 1 1z"/></svg>
        </button>
        <button class="icon-btn" id="btn-about" title="About momputer" aria-label="About momputer" aria-pressed="false">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg>
        </button>
        <button class="icon-btn" id="btn-settings" title="Settings" aria-label="Settings" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
        <button class="icon-btn" id="btn-hide" title="Tuck into the tray (mom keeps watching)" aria-label="Hide">
          <svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg>
        </button>
      </div>
    </header>

    <section class="stage" id="stage" aria-label="Your PC on mom's desk">
      <div class="stage-3d" id="stage-3d"></div>
      <div class="stage-screen" id="stage-screen"></div>
      <div class="stage-parts" id="stage-parts" role="group" aria-label="The parts of your PC"></div>
      <div class="stage-info" id="stage-info" aria-live="polite"></div>
      <div class="stage-tip" id="stage-tip" hidden></div>
    </section>

    <section class="reader" id="reader" aria-label="Reading" hidden></section>

    <section class="note" aria-live="polite">
      <div class="screen" id="face" tabindex="0" role="button" aria-label="Mom. Click to boop her, drag to move the widget."></div>
      <div class="readout">
        <div class="big" id="big"></div>
        <div class="big-label" id="big-label"></div>
        <p class="line" id="mom-line">Having a look around…</p>
      </div>
      <div class="alarm" id="alarm" hidden></div>
      <div class="note-actions" id="note-actions" hidden>
        <button class="primary" id="btn-clean"><span class="led red" aria-hidden="true"></span><span id="clean-label">Clean up</span></button>
        <span class="note-sub" id="note-sub"></span>
      </div>
    </section>

    <nav class="tabs" role="tablist" aria-label="What mom looks after">
      <span class="tab-thumb" id="tab-thumb" aria-hidden="true"></span>
      <button class="tab" role="tab" data-tab="running" aria-selected="true">Running<span class="count num" id="count-running"></span></button>
      <button class="tab" role="tab" data-tab="upkeep" aria-selected="false">Upkeep</button>
      <button class="tab" role="tab" data-tab="rooms" aria-selected="false">Rooms</button>
      <button class="tab" role="tab" data-tab="rules" aria-selected="false">House rules<span class="count num" id="count-rules"></span></button>
    </nav>

    <main class="page" id="page" role="tabpanel"></main>

    <div class="sheet" id="sheet" hidden>
      <div class="backdrop" data-act="close-sheet"></div>
      <div class="sheet-panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
        <div class="sheet-grip" aria-hidden="true"></div>
        <div class="sheet-body" id="sheet-body"></div>
      </div>
    </div>
    <div class="toast" id="toast" role="status" hidden></div>
  </div>
  <script src="vendor/gsap.min.js"></script>
  <script src="vendor/MorphSVGPlugin.min.js"></script>
  <script src="vendor/idiomorph.min.js"></script>
  <script src="mock.js"></script>
  <script src="mom.js"></script>
  <script src="app.js"></script>
</body>
</html>
