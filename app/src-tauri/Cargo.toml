[package]
name = "momputer"
description = "momputer: a mom for you, your computer and your AIs. Cleans up what AI agents left running and looks after the PC."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
rust-version.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
mom-core.workspace = true
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2"
tauri-plugin-dialog = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"

[features]
# Tauri runs in production mode (serving ../ui from the binary) unless `tauri dev` turns this off.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[target.'cfg(windows)'.dependencies]
# Notifications that say they're from mom, not from Windows PowerShell.
tauri-winrt-notification = "0.8"
windows-registry = "0.6"
