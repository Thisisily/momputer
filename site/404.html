<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Not here · momputer</title>
  <meta name="color-scheme" content="light dark">
  <link rel="icon" href="/momputer/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400..700&display=swap">
  <style>
    :root { --bg: #ececec; --card: #fff; --ink: #000; --ink-2: #5a5a5a; }
    @media (prefers-color-scheme: dark) { :root { --bg: #000; --card: #121212; --ink: #fff; --ink-2: #a8a8a8; } }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); }
    body { display: grid; place-items: center; padding: 20px; box-sizing: border-box;
      font: 16px/1.5 "Geist", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif; }
    main { max-width: 420px; padding: 32px; border-radius: 28px; background: var(--card); text-align: center; }
    img { display: block; margin: 0 auto 18px; border-radius: 50%; background: #fff; }
    h1 { margin: 0; font-size: 22px; font-weight: 650; letter-spacing: -0.015em; }
    p { margin: 8px 0 22px; color: var(--ink-2); }
    a.home { display: inline-flex; align-items: center; height: 44px; padding: 0 22px; border-radius: 22px;
      background: var(--ink); color: var(--bg); font-weight: 600; text-decoration: none; }
    a.home:hover { opacity: 0.88; }
  </style>
</head>
<body>
  <main>
    <img src="/momputer/mom.svg" width="96" height="96" alt="Mom, a cartoon granny with giant round glasses">
    <h1>This page isn't here</h1>
    <p>Mom looked everywhere. It may have moved; the home page has everything.</p>
    <a class="home" href="/momputer/">Go to momputer</a>
  </main>
</body>
</html>
