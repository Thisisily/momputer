name: release

# Builds momputer, has SignPath sign it, and drafts a GitHub release with the installers. Run it
# by hand (Actions > release > Run workflow): it drafts "momputer <version>" for the version in
# Cargo.toml, and publishing that draft makes the tag. (It doesn't run for tags: publishing would
# start it a second time, for a release that's already out.) Signing takes two requests, each approved by hand in SignPath:
# first momputer.exe and mom.exe, then the installers built from those signed files. Without the
# SignPath secret and settings (see docs/signing.md) the release is built unsigned and says so.
#
# Every action is pinned to a commit, not a tag (Dependabot proposes updates): they run next to
# the SignPath token and the files that get signed.

on:
  workflow_dispatch:

permissions:
  contents: write # to draft the release
  actions: read # SignPath fetches the files this workflow uploads

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    env:
      SIGN: ${{ secrets.SIGNPATH_API_TOKEN != '' && vars.SIGNPATH_ORGANIZATION_ID != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      # What gets signed is built from scratch: no build cache then. A draft that won't be signed
      # may reuse what earlier release builds compiled of the libraries momputer is built from
      # (they rarely change, and compiling them is half of a build); momputer's own code is
      # compiled afresh every time either way.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        if: env.SIGN != 'true'
        with:
          prefix-key: release

      # The Tauri CLI (it only puts the installers together) is Tauri's own ready-made build,
      # checked against the fingerprint written here. Compiling it from source took ten minutes
      # of every run. For a newer one, change the version and the fingerprint together: both
      # are on its release page (github.com/tauri-apps/tauri/releases, "tauri-cli v...").
      - name: Get the Tauri CLI
        shell: pwsh
        env:
          TAURI_CLI: 2.12.2
          TAURI_CLI_SHA256: bef439eb1a0edd5192ed0009945e5de660b642a51519efe7d6953d70c5ab1939
        run: |
          $zip = Join-Path $env:RUNNER_TEMP 'cargo-tauri.zip'
          Invoke-WebRequest "https://github.com/tauri-apps/tauri/releases/download/tauri-cli-v$env:TAURI_CLI/cargo-tauri-x86_64-pc-windows-msvc.zip" -OutFile $zip
          $got = (Get-FileHash $zip -Algorithm SHA256).Hash.ToLower()
          if ($got -ne $env:TAURI_CLI_SHA256) { throw "The Tauri CLI that came down isn't the one expected (its fingerprint is $got)." }
          $bin = Join-Path $HOME '.cargo/bin'
          Expand-Archive $zip -DestinationPath $bin -Force
          cargo tauri --version
          if ($LASTEXITCODE -ne 0) { throw 'The Tauri CLI is not where cargo looks for it.' }

      - name: Version
        id: version
        shell: pwsh
        run: |
          $v = ((cargo metadata --no-deps --format-version 1 | ConvertFrom-Json).packages | Where-Object name -eq 'momputer').version
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$v") { throw "The tag $env:GITHUB_REF_NAME doesn't match the version in Cargo.toml ($v)." }
          "version=$v" >> $env:GITHUB_OUTPUT

      - name: Build momputer.exe and mom.exe
        shell: pwsh
        run: |
          ./scripts/build.ps1 -NoBundle
          New-Item -ItemType Directory -Force dist/unsigned | Out-Null
          Copy-Item target/release/momputer.exe, target/release/mom.exe dist/unsigned/

      - name: Upload them for signing
        id: upload-binaries
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: binaries-unsigned
          path: dist/unsigned/
          if-no-files-found: error

      - name: Sign momputer.exe and mom.exe (approve it in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: binaries
          github-artifact-id: ${{ steps.upload-binaries.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/signed
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Put the signed files back
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          Copy-Item dist/signed/momputer.exe target/release/momputer.exe -Force
          Copy-Item dist/signed/mom.exe target/release/mom.exe -Force
          foreach ($f in 'target/release/momputer.exe', 'target/release/mom.exe') {
            $s = Get-AuthenticodeSignature $f
            if ($s.Status -ne 'Valid') { throw "$f isn't validly signed: $($s.StatusMessage)" }
            Write-Host "$f is signed by $($s.SignerCertificate.Subject)"
          }

      - name: Build the installers
        shell: pwsh
        run: |
          ./scripts/build.ps1 -BundleOnly
          New-Item -ItemType Directory -Force dist/installers | Out-Null
          Copy-Item target/release/bundle/nsis/*.exe, target/release/bundle/msi/*.msi dist/installers/

      - name: Upload the installers for signing
        id: upload-installers
        if: env.SIGN == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: installers-unsigned
          path: dist/installers/
          if-no-files-found: error

      - name: Sign the installers (approve it in SignPath)
        if: env.SIGN == 'true'
        uses: signpath/github-action-submit-signing-request@f6d04783b4569d051e0c80105fe66e82819d0092 # v3
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG }}
          artifact-configuration-slug: installers
          github-artifact-id: ${{ steps.upload-installers.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: dist/release
          parameters: |
            version: ${{ toJSON(steps.version.outputs.version) }}

      - name: Check the installers' signatures
        if: env.SIGN == 'true'
        shell: pwsh
        run: |
          $files = Get-ChildItem dist/release -File -Include *.exe, *.msi -Recurse
          if ($files.Count -ne 2) { throw "Expected the setup program and the MSI, got: $($files.Name -join ', ')" }
          foreach ($f in $files) {
            $s = Get-AuthenticodeSignature $f.FullName
            if ($s.Status -ne 'Valid') { throw "$($f.Name) isn't validly signed: $($s.StatusMessage)" }
            Write-Host "$($f.Name) is signed by $($s.SignerCertificate.Subject)"
          }

      - name: Unsigned, then
        if: env.SIGN != 'true'
        shell: pwsh
        run: |
          Write-Host "::warning::SignPath isn't set up (see docs/signing.md), so this release is unsigned."
          Copy-Item dist/installers dist/release -Recurse

      # The tests run in the ci workflow for every commit on main. This waits for that run of this
      # very commit instead of running them a second time, and drafts nothing unless they passed.
      # (For a commit ci never ran for, they run here.)
      - name: The tests passed for this commit
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $run = $null
          $until = (Get-Date).AddMinutes(25)
          do {
            $runs = gh api "repos/$env:GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$env:GITHUB_SHA&per_page=10" | ConvertFrom-Json
            $run = $runs.workflow_runs | Sort-Object created_at -Descending | Select-Object -First 1
            if ($null -eq $run -or $run.status -eq 'completed') { break }
            Write-Host "ci is still running for this commit; waiting for it."
            Start-Sleep -Seconds 15
          } while ((Get-Date) -lt $until)
          if ($null -eq $run) {
            Write-Host 'ci never ran for this commit, so the tests run here.'
            cargo test -p mom-core -p mom-cli
            if ($LASTEXITCODE -ne 0) { throw 'The tests failed.' }
          } elseif ($run.status -ne 'completed') {
            throw "ci is still running for this commit after 25 minutes: $($run.html_url)"
          } elseif ($run.conclusion -ne 'success') {
            throw "The tests didn't pass for this commit ($($run.conclusion)), so no release is drafted: $($run.html_url)"
          } else {
            Write-Host "The tests passed: $($run.html_url)"
          }

      - name: Draft the release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          $sums = Get-ChildItem dist/release -File | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower(), $_.Name }
          $sums | Set-Content dist/release/SHA256SUMS.txt -Encoding ascii
          $files = (Get-ChildItem dist/release -File).FullName
          $tag = "v$env:VERSION"
          $existing = gh api "repos/$env:GITHUB_REPOSITORY/releases?per_page=100" | ConvertFrom-Json | Where-Object tag_name -eq $tag
          if ($null -eq $existing) {
            gh release create $tag @files --draft --title "momputer $env:VERSION" --generate-notes --target $env:GITHUB_SHA
          } elseif ($existing.draft) {
            # The same version built again: new files, and the draft now stands for this commit,
            # so publishing it tags what these files were built from.
            gh release upload $tag @files --clobber
            if ($LASTEXITCODE -eq 0) { gh release edit $tag --target $env:GITHUB_SHA }
          } else {
            throw "$tag is already published; bump the version for a new release."
          }
          if ($LASTEXITCODE -ne 0) { throw 'drafting the release failed' }
