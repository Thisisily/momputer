name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test the core and the CLI
        run: cargo test -p mom-core -p mom-cli
      - name: Build the app
        shell: pwsh
        run: ./scripts/build.ps1 -NoBundle
