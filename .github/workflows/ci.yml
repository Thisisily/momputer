name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Test the core and the CLI
        run: cargo test -p mom-core -p mom-cli
      - name: Test Files selection and refresh behavior
        run: npm run test:ui
      - name: Build the app
        shell: pwsh
        run: ./scripts/build.ps1 -NoBundle

  # The skills' own tests: made-up folders, calendars and listings in a scratch folder under
  # Temp, nothing else. Standard-library Python, and the runner's own Edge for the pages.
  skills:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test the skills
        shell: pwsh
        run: |
          # Temp by its full name: the runner spells it with a short one, which the skills refuse to work under.
          $temp = python -I -c "import os, tempfile; print(os.path.realpath(tempfile.gettempdir()))"
          $scratch = Join-Path $temp "skill-tests"
          New-Item -ItemType Directory -Force $scratch | Out-Null
          python -I skills/tests/run_all.py $scratch
